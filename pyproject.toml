[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "docverf"
version = "0.1.0"
description = "AICTE DocVerif: document verification decision-support (see docs/TRD.md)"
readme = "README.md"
requires-python = ">=3.11,<3.13"
# Exact pins live in requirements/*.txt; this is only what `import docverf` needs.
dependencies = ["pydantic>=2.7", "python-dotenv>=1.0"]

[tool.setuptools.packages.find]
where = ["packages"]
include = ["docverf*"]

[tool.setuptools.package-data]
"docverf.synthetic" = ["templates/*.j2"]

[tool.ruff]
line-length = 100
force-exclude = true
target-version = "py311"
# docs/ is excluded because ruff also formats Python code blocks inside Markdown.
extend-exclude = ["apps", "blockchain", "data", "docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# TRD §5 is a frozen contract: keep `(str, Enum)` and the verbatim inline comments.
"packages/docverf/schemas/*" = ["UP042", "E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: integration tests that need the full stack (excluded in CI)"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = false
exclude = ["apps/", "blockchain/", "data/"]
